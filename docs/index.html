<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Arena</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-main: #020617;
    --bg-card: #0f172a;
    --bg-card-alt: #1e293b;
    --border: #1e293b;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #475569;
    --green: #4ade80;
    --red: #f87171;
    --cyan: #22d3ee;
    --amber: #fbbf24;
    --mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
  }

  body {
    background: var(--bg-main);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 16px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .header-left .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .header-left h1 {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .header-stats {
    display: flex;
    gap: 24px;
    align-items: flex-end;
  }

  .header-stat { text-align: right; }

  .header-stat .label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }

  .header-stat .value {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
  }

  /* --- market sections --- */
  .market-section { margin-bottom: 28px; }

  .section-title {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .section-title .name {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--text-secondary);
    text-transform: uppercase;
  }

  .section-title .agg {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
  }

  /* --- model panels --- */
  .panels {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 16px;
  }

  .model-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }

  .model-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .model-banner .dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: var(--cyan);
  }

  .model-banner .name {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
  }

  .model-banner .subtitle {
    font-size: 12px;
    color: var(--text-secondary);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 2px 8px;
    border-radius: 4px;
    background: rgba(34, 211, 238, 0.12);
    border: 1px solid rgba(34, 211, 238, 0.4);
    color: var(--cyan);
    margin-left: auto;
  }

  .status-badge.offline {
    background: rgba(71, 85, 105, 0.15);
    border-color: rgba(71, 85, 105, 0.5);
    color: var(--text-muted);
  }

  /* Live, but holding cash — distinct from both LIVE and OFFLINE. */
  .status-badge.flat {
    background: rgba(251, 191, 36, 0.12);
    border-color: rgba(251, 191, 36, 0.4);
    color: var(--amber);
  }

  .flat-note {
    display: flex;
    gap: 8px;
    align-items: baseline;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-secondary);
    background: rgba(251, 191, 36, 0.06);
    border: 1px solid rgba(251, 191, 36, 0.25);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
  }

  .flat-note .icon { color: var(--amber); }

  .status-badge .pulse {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 6px var(--cyan);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .chart-wrap {
    background: var(--bg-main);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 12px;
  }

  .chart-wrap canvas {
    width: 100% !important;
    max-height: 200px;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }

  .metric-card {
    background: var(--bg-card-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }

  .metric-card .label {
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .metric-card .value {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
  }

  .positions-section h3 {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .positions-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 12px;
  }

  .positions-table th {
    text-align: left;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    padding: 5px 8px;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
  }

  .positions-table td {
    padding: 6px 8px;
    border-bottom: 1px solid rgba(30, 41, 59, 0.5);
    color: var(--text-primary);
  }

  .up { color: var(--green); }
  .down { color: var(--red); }

  .empty-state {
    text-align: center;
    padding: 28px 16px;
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 12px;
  }

  .empty-state .icon {
    font-size: 26px;
    margin-bottom: 10px;
    opacity: 0.4;
  }

  .last-updated {
    text-align: center;
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-muted);
  }

  @media (max-width: 480px) {
    body { padding: 12px; }
    .header-stat .value { font-size: 16px; }
    .header-stats { gap: 16px; }
    .panels { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="eyebrow">STOCK_PREDICTOR</div>
    <h1>Trading Arena</h1>
  </div>
  <div class="header-stats">
    <div class="header-stat">
      <div class="label">US EQUITY (USD)</div>
      <div class="value" id="total-equity">—</div>
    </div>
    <div class="header-stat">
      <div class="label">US P&L (USD)</div>
      <div class="value" id="total-pnl">—</div>
    </div>
  </div>
</div>

<div id="sections"></div>

<script>
// ===================================================
// CONFIG
// ===================================================
const REPO_OWNER = "kareemhsalama";
const REPO_NAME = "stock_predictor";
const BRANCH = "main";

const USD = { code: "USD", symbol: "$", axisDiv: 1000, axisSuffix: "k" };
const EGP = { code: "EGP", symbol: "EGP ", axisDiv: 1000, axisSuffix: "k" };

// Each model gets its own isolated ledger. New models render automatically as
// their ledger files come online — a missing/empty ledger shows a placeholder
// instead of breaking the page.
const SECTIONS = [
  {
    title: "US Markets",
    currency: USD,
    models: [
      { key: "a-us", file: "data/model_a_ledger.json",
        name: "Model A", subtitle: "· Technical ML · Random Forest", currency: USD },
      { key: "d-us", file: "data/model_d_ledger.json",
        name: "Model D", subtitle: "· Mean Reversion · Z-Score", currency: USD },
      { key: "ai-us", file: "data/model_ai_ledger.json",
        name: "Model AI", subtitle: "· Regime Momentum · Vol Target", currency: USD },
    ],
  },
  {
    title: "EGX (Egyptian Exchange)",
    currency: EGP,
    models: [
      { key: "a-egx", file: "data/model_a_egx_ledger.json",
        name: "Model A · EGX", subtitle: "· Technical ML · Random Forest", currency: EGP },
      { key: "ai-egx", file: "data/model_ai_egx_ledger.json",
        name: "Model AI · EGX", subtitle: "· Regime Momentum · Vol Target", currency: EGP },
    ],
  },
];

const rawUrl = (file) =>
  `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${file}`;

// ===================================================
// Formatting
// ===================================================
function fmtMoney(v, cur, opts = {}) {
  const digits = opts.digits ?? 0;
  return `${cur.symbol}${Math.abs(v).toLocaleString(undefined, { maximumFractionDigits: digits, minimumFractionDigits: digits })}`;
}
function fmtSigned(v, cur) {
  return `${v >= 0 ? "+" : "-"}${fmtMoney(v, cur)}`;
}

// ===================================================
// Metric computation
// ===================================================
function computeMetrics(snapshots, initialBudget) {
  const latest = snapshots[snapshots.length - 1];
  const equity = latest.equity;
  const pnl = equity - initialBudget;
  const totalReturn = (pnl / initialBudget) * 100;

  const dailyReturns = [];
  for (let i = 1; i < snapshots.length; i++) {
    const prev = snapshots[i - 1].equity;
    const curr = snapshots[i].equity;
    if (prev > 0) dailyReturns.push((curr - prev) / prev);
  }

  let sharpe = 0;
  if (dailyReturns.length > 1) {
    const avg = dailyReturns.reduce((a, b) => a + b, 0) / dailyReturns.length;
    const std = Math.sqrt(dailyReturns.reduce((a, b) => a + (b - avg) ** 2, 0) / dailyReturns.length);
    sharpe = std > 0 ? (avg / std) * Math.sqrt(252) : 0;
  }

  const wins = dailyReturns.filter(r => r > 0).length;
  const losses = dailyReturns.filter(r => r <= 0).length;
  const winRate = dailyReturns.length > 0 ? wins / dailyReturns.length : 0;

  let maxEquity = 0, maxDrawdown = 0;
  for (const s of snapshots) {
    maxEquity = Math.max(maxEquity, s.equity);
    if (maxEquity > 0) maxDrawdown = Math.max(maxDrawdown, (maxEquity - s.equity) / maxEquity);
  }

  return {
    equity, pnl, totalReturn, sharpe, winRate, maxDrawdown,
    tradingDays: snapshots.length, wins, losses,
    latestDate: latest.date, positions: latest.positions || [], initialBudget,
  };
}

// ===================================================
// Rendering
// ===================================================
function panelSkeleton(model) {
  return `
    <div class="model-panel" id="panel-${model.key}">
      <div class="model-banner">
        <span class="dot"></span>
        <span class="name">${model.name}</span>
        <span class="subtitle">${model.subtitle}</span>
        <span class="status-badge offline" id="badge-${model.key}">…</span>
      </div>
      <div id="body-${model.key}">
        <div class="empty-state"><div class="icon">⏳</div>Loading…</div>
      </div>
    </div>`;
}

function renderMetricsHTML(m, cur) {
  const metrics = [
    { label: "Return", value: `${m.totalReturn >= 0 ? "+" : ""}${m.totalReturn.toFixed(2)}%`, good: m.totalReturn >= 0 },
    { label: "Sharpe", value: m.sharpe.toFixed(2), good: m.sharpe > 1 },
    { label: "Win rate", value: `${(m.winRate * 100).toFixed(1)}%`, good: m.winRate > 0.5 },
    { label: "Max DD", value: `${(m.maxDrawdown * 100).toFixed(2)}%`, good: m.maxDrawdown < 0.1 },
    { label: "Days", value: m.tradingDays, good: null },
    { label: "W / L", value: `${m.wins} / ${m.losses}`, good: m.wins > m.losses },
  ];
  return `<div class="metrics-grid">${metrics.map(met => `
    <div class="metric-card">
      <div class="label">${met.label}</div>
      <div class="value ${met.good === null ? "" : met.good ? "up" : "down"}">${met.value}</div>
    </div>`).join("")}</div>`;
}

function renderPositionsHTML(positions, cur) {
  if (!positions || positions.length === 0) {
    return `<div class="positions-section"><h3>Open positions</h3>
      <div class="empty-state"><div class="icon">📭</div>No open positions</div></div>`;
  }
  return `<div class="positions-section"><h3>Open positions</h3>
    <table class="positions-table">
      <thead><tr><th>Symbol</th><th>Qty</th><th>Avg entry</th><th>Current</th><th>P&L</th></tr></thead>
      <tbody>${positions.map(p => `
        <tr>
          <td style="font-weight:700">${p.symbol}</td>
          <td>${p.qty}</td>
          <td>${fmtMoney(parseFloat(p.avg_entry), cur, { digits: 2 })}</td>
          <td>${fmtMoney(parseFloat(p.current_price), cur, { digits: 2 })}</td>
          <td class="${p.unrealized_pnl >= 0 ? "up" : "down"}">${fmtSigned(parseFloat(p.unrealized_pnl), cur)}</td>
        </tr>`).join("")}</tbody>
    </table></div>`;
}

function renderChart(canvasId, snapshots, m, cur) {
  const ctx = document.getElementById(canvasId).getContext("2d");
  const labels = snapshots.map(s => s.date);
  const data = snapshots.map(s => s.equity);

  const chart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "Equity", data,
        borderColor: "#22d3ee",
        backgroundColor: "rgba(34, 211, 238, 0.08)",
        fill: true, tension: 0.3, pointRadius: 0, pointHitRadius: 10, borderWidth: 2,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { intersect: false, mode: "index" },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#0f172a", borderColor: "#1e293b", borderWidth: 1,
          titleFont: { family: "'JetBrains Mono', monospace", size: 11 },
          bodyFont: { family: "'JetBrains Mono', monospace", size: 13 },
          padding: 10,
          callbacks: { label: (c) => fmtMoney(c.parsed.y, cur, { digits: 2 }) },
        },
      },
      scales: {
        x: {
          ticks: { color: "#475569", font: { family: "'JetBrains Mono', monospace", size: 9 }, maxTicksLimit: 6 },
          grid: { color: "rgba(30, 41, 59, 0.5)" }, border: { color: "#1e293b" },
        },
        y: {
          ticks: {
            color: "#475569", font: { family: "'JetBrains Mono', monospace", size: 9 },
            callback: (v) => `${cur.symbol}${(v / cur.axisDiv).toFixed(0)}${cur.axisSuffix}`,
          },
          grid: { color: "rgba(30, 41, 59, 0.5)" }, border: { display: false },
        },
      },
    },
    plugins: [{
      id: "baseline",
      afterDraw(chartObj) {
        const yScale = chartObj.scales.y;
        const y = yScale.getPixelForValue(m.initialBudget);
        const c = chartObj.ctx;
        c.save();
        c.setLineDash([4, 4]);
        c.strokeStyle = "#334155";
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(chartObj.chartArea.left, y);
        c.lineTo(chartObj.chartArea.right, y);
        c.stroke();
        c.fillStyle = "#475569";
        c.font = "9px 'JetBrains Mono', monospace";
        const label = `${cur.symbol}${(m.initialBudget / cur.axisDiv).toFixed(0)}${cur.axisSuffix} initial`;
        c.fillText(label, chartObj.chartArea.right - 84, y - 5);
        c.restore();
      },
    }],
  });
  return chart;
}

// A model that has never opened a position sits at exactly its initial equity
// forever: flat line, +0.00%, 0 / 0 W-L, no positions. That is indistinguishable
// from a broken panel, so call it out as idle-by-design instead of "LIVE".
function hasTraded(snapshots, initialBudget) {
  return snapshots.some(s =>
    (s.positions || []).length > 0 || Math.abs(s.equity - initialBudget) > 0.005);
}

function renderPanel(model, ledger) {
  const snapshots = ledger.snapshots || [];
  const badge = document.getElementById(`badge-${model.key}`);
  const body = document.getElementById(`body-${model.key}`);

  if (snapshots.length === 0) {
    badge.className = "status-badge offline";
    badge.textContent = "NO DATA";
    body.innerHTML = `<div class="empty-state"><div class="icon">📡</div>No snapshots yet — run the workflow to seed data</div>`;
    return null;
  }

  const initialBudget = ledger.initial_budget ?? snapshots[0].equity;
  const m = computeMetrics(snapshots, initialBudget);
  const traded = hasTraded(snapshots, initialBudget);

  if (traded) {
    badge.className = "status-badge";
    badge.innerHTML = `<span class="pulse"></span>LIVE`;
  } else {
    badge.className = "status-badge flat";
    badge.textContent = "NO SIGNAL";
  }

  const flatNote = traded ? "" : `
    <div class="flat-note">
      <span class="icon">⏸</span>
      <span>Holding cash — the entry signal has not triggered since ${snapshots[0].date}.
      The model is running (${snapshots.length} snapshot${snapshots.length === 1 ? "" : "s"}
      through ${m.latestDate}); it just has not found a setup yet.</span>
    </div>`;

  body.innerHTML = `
    ${flatNote}
    <div class="chart-wrap"><canvas id="chart-${model.key}"></canvas></div>
    ${renderMetricsHTML(m, model.currency)}
    ${renderPositionsHTML(m.positions, model.currency)}
    <div class="last-updated">Last snapshot: ${m.latestDate}</div>`;

  renderChart(`chart-${model.key}`, snapshots, m, model.currency);
  return m;
}

function markOffline(model, reason) {
  const badge = document.getElementById(`badge-${model.key}`);
  const body = document.getElementById(`body-${model.key}`);
  badge.className = "status-badge offline";
  badge.textContent = "OFFLINE";
  body.innerHTML = `<div class="empty-state"><div class="icon">🚧</div>Not live yet</div>`;
}

// ===================================================
// Init
// ===================================================
async function init() {
  const sectionsEl = document.getElementById("sections");

  // Build the DOM skeleton first so panels appear immediately.
  sectionsEl.innerHTML = SECTIONS.map(sec => `
    <div class="market-section">
      <div class="section-title">
        <span class="name">${sec.title}</span>
        <span class="agg" id="agg-${sec.title.replace(/\W+/g, "")}"></span>
      </div>
      <div class="panels">${sec.models.map(panelSkeleton).join("")}</div>
    </div>`).join("");

  let usEquity = 0, usPnl = 0, haveUsData = false;

  for (const sec of SECTIONS) {
    let secEquity = 0, secPnl = 0, secHasData = false;

    for (const model of sec.models) {
      try {
        const resp = await fetch(rawUrl(model.file), { cache: "no-store" });
        if (!resp.ok) { markOffline(model); continue; }
        const ledger = await resp.json();
        const m = renderPanel(model, ledger);
        if (m) {
          secEquity += m.equity;
          secPnl += m.pnl;
          secHasData = true;
        }
      } catch (err) {
        console.error(model.key, err);
        markOffline(model);
      }
    }

    // Section aggregate (single currency per section, so summing is safe).
    const aggEl = document.getElementById(`agg-${sec.title.replace(/\W+/g, "")}`);
    if (aggEl && secHasData) {
      aggEl.innerHTML = `${fmtMoney(secEquity, sec.currency)} equity · ` +
        `<span class="${secPnl >= 0 ? "up" : "down"}">${fmtSigned(secPnl, sec.currency)}</span>`;
    }

    if (sec.currency.code === "USD" && secHasData) {
      usEquity += secEquity; usPnl += secPnl; haveUsData = true;
    }
  }

  if (haveUsData) {
    document.getElementById("total-equity").textContent = fmtMoney(usEquity, USD);
    const pnlEl = document.getElementById("total-pnl");
    pnlEl.textContent = fmtSigned(usPnl, USD);
    pnlEl.className = `value ${usPnl >= 0 ? "up" : "down"}`;
  }
}

init();
</script>
</body>
</html>
