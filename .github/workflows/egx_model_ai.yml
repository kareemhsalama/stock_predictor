name: MODEL_AI EGX (Regime Momentum)

on:
  schedule:
    # 12:35 UTC, ~20 min after the 14:15 EET EGX close (and after EGX Model A's
    # 12:30 slot). Egypt observes DST, so this lands 14:35 Cairo in winter /
    # 15:35 in summer — post-close either way, which is all this job needs.
    # Sun-Thu are the EGX trading days (cron day-of-week: Sun=0 .. Thu=4).
    - cron: "35 12 * * 0-4"
  workflow_dispatch:

jobs:
  egx-model-ai:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Trade + snapshot MODEL_AI on EGX
        run: python egx_model_ai.py

      - name: Commit ledger update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/model_ai_egx_ledger.json
          git diff --cached --quiet || git commit -m "MODEL_AI EGX $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
