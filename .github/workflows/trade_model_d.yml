name: Daily Trade - Model D (Mean Reversion)

on:
  schedule:
    # 15:05 UTC — offset from Model A's 14:45 slot so they don't race a runner.
    # Must stay inside US market hours under both offsets (14:30-20:00 UTC in
    # winter/EST, 13:30-20:00 in summer/EDT): 15:05 UTC = 11:05 ET (EDT) /
    # 10:05 ET (EST). The old 14:05 UTC was 9:05 ET in winter — before the open,
    # so the clock.is_open guard skipped every run from November to March.
    - cron: "5 15 * * 1-5"
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Model D trading script
        env:
          # Model D's own paper account (see live_trader_meanreversion.py).
          ALPACA_API_KEY_D: ${{ secrets.ALPACA_API_KEY_D }}
          ALPACA_SECRET_KEY_D: ${{ secrets.ALPACA_SECRET_KEY_D }}
        run: python live_trader_meanreversion.py
