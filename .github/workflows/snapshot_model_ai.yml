name: Snapshot MODEL_AI Ledger

on:
  schedule:
    # 22:00 UTC — after the US close under both offsets (18:00 ET in EDT,
    # 17:00 ET in EST), and 15 min behind Model D's 21:45 snapshot.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Take portfolio snapshot
        run: python scripts/snapshot_ledger.py
        env:
          # Third paper account, isolated from Model A and Model D.
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY_AI }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY_AI }}
          LEDGER_PATH: data/model_ai_ledger.json
          MODEL_ID: AI
          MODEL_NAME: Regime-Aware Momentum + Vol Target

      - name: Commit ledger update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/model_ai_ledger.json
          git diff --cached --quiet || git commit -m "snapshot: MODEL_AI $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
