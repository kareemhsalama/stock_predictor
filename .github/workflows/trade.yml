name: Daily Trade

on:
  schedule:
    # Actions cron is always UTC, so the slot has to sit inside US market hours
    # under BOTH offsets: 14:30-20:00 UTC in winter (EST), 13:30-20:00 in summer
    # (EDT). 14:45 UTC = 10:45 ET (EDT) / 9:45 ET (EST) — open year-round.
    # The old 13:45 UTC ran 45 min BEFORE the winter open and silently no-oped
    # on the clock.is_open guard every day from November to March.
    - cron: '45 14 * * 1-5'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading script
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python live_trader.py
